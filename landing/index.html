<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bounce Back — Men Sportswear</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#0E0F13;color:#F4F4F2;
      min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    .wrap{max-width:640px}
    .eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#7C8CFF;font-weight:600}
    h1{font-size:clamp(40px,9vw,84px);font-weight:800;letter-spacing:-.02em;line-height:.95;margin:16px 0}
    p{color:#A6A9B2;font-size:18px;line-height:1.7;margin-bottom:28px}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .cta{display:inline-block;text-decoration:none;font-weight:600;padding:15px 30px;border-radius:40px;font-size:16px}
    .cta.primary{background:#2C43F0;color:#fff}
    .cta.primary:hover{background:#4055ff}
    .cta.line{background:#06C755;color:#fff}          /* LINE OA — ลูกค้าแอดคุยตรง */
    .cta.line:hover{background:#05b34c}
    .soon{margin-top:20px;font-size:13px;color:#5B5E66;letter-spacing:.1em}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Men Sportswear</div>
    <h1>BOUNCE BACK</h1>
    <p>กลับมาแข็งแกร่งกว่าเดิม — เสื้อผ้ากีฬาผู้ชายที่ออกแบบมาเพื่อการเคลื่อนไหวจริง</p>
    <div class="btns">
      <a class="cta primary" href="#">เร็ว ๆ นี้</a>
      <!-- แทนที่ @basicid ด้วย Basic ID ของ LINE OA จริง เช่น @bounceback -->
      <a class="cta line" href="https://line.me/R/ti/p/@basicid" target="_blank" rel="noopener">แอดไลน์คุยกับร้าน</a>
    </div>
    <div class="soon">COMING SOON · 2026</div>
  </div>
</body>
</html>
